spring.application.name=routesync-backend

# Server
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/routesync
spring.datasource.username=postgres
spring.datasource.password=Login$123
spring.datasource.driver-class-name=org.postgresql.Driver

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.web=TRACE
logging.level.org.springframework.security.authorization=TRACE

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# =====================================================
# RouteSync JWT Configuration
# =====================================================

# JWT secret
# IMPORTANT:
# Production mein is value ko environment variable se provide karna.
routesync.jwt.secret=${JWT_SECRET:RouteSyncSuperSecretKeyForJwtAuthentication2026SecureKey}

# Access token validity
# 15 minutes = 900000 milliseconds
routesync.jwt.access-token-expiration=900000

# Refresh token validity
# 7 days = 604800000 milliseconds
routesync.jwt.refresh-token-expiration=604800000